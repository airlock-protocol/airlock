# Publish JavaScript packages to the public npm registry using trusted
# publishing (OIDC) — no long-lived NPM_TOKEN.
#
# Prerequisites (one-time, per package, on npmjs.com):
#   airlock-client and airlock-mcp -> Settings -> Trusted publisher:
#     Organization or user: airlock-protocol
#     Repository:           airlock
#     Workflow filename:    publish-npm.yml
#     Environment:          leave blank (this workflow declares none)
#
# Trusted publishing also generates provenance attestations automatically,
# so --provenance is not passed explicitly.
#
# Order: airlock-client first, then airlock-mcp, which depends on it.
# Re-run if the second publish fails on registry propagation.

name: Publish npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC: lets the job mint the identity token npm verifies.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; pin explicitly rather
      # than relying on whichever version ships with the Node release.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install and build
        run: |
          npm ci
          npm run build:js

      - name: Publish airlock-client
        run: npm publish -w airlock-client --access public

      - name: Publish airlock-mcp
        run: npm publish -w airlock-mcp --access public
